<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6bcb" />
    <meta name="description" content="Offline reefer loading check for the electro team" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reefer Check" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Reefer Check</title>
    <style>
      /* launch splash: always dark (same as the Android system splash, manifest background_color) */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #2b2b2b; transition: opacity .6s ease; }
      #splash .logo { position: relative; width: min(88vw, 62vh, 440px); aspect-ratio: 1; }
      #splash img { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .glow { opacity: 0; animation: glow 2.4s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash .glow { animation: none; opacity: .6; } }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="logo"><img src="./splash.webp" alt="" /><img class="glow" src="./splash-glow.webp" alt="" /></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
